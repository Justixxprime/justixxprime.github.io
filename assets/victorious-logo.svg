<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" width="600" height="660">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#EFCB98"/>
      <stop offset="55%" stop-color="#CE9257"/>
      <stop offset="100%" stop-color="#9C5A2E"/>
    </linearGradient>
    <radialGradient id="budGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F7E1B8"/>
      <stop offset="100%" stop-color="#C4813F"/>
    </radialGradient>
  </defs>

  <!-- ================= MARK: two slender bag straps forming a V, gathered at a rounded clasp ================= -->
  <g id="mark">
    <path d="M 210 40 C 262 176, 288 316, 297 404" fill="none" stroke="url(#strapGrad)" stroke-width="27" stroke-linecap="round"/>
    <path d="M 390 40 C 338 176, 312 316, 303 404" fill="none" stroke="url(#strapGrad)" stroke-width="27" stroke-linecap="round"/>

    <path d="M 213 64 C 260 186, 284 314, 293 392" fill="none" stroke="#FBEBD1" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1 9" opacity="0.75"/>
    <path d="M 387 64 C 340 186, 316 314, 307 392" fill="none" stroke="#FBEBD1" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1 9" opacity="0.75"/>

    <!-- a small round clasp/bead where the two straps gather, like a bag's hardware detail -->
    <circle cx="300" cy="418" r="17" fill="url(#budGrad)"/>
    <circle cx="300" cy="418" r="17" fill="none" stroke="#7A3B1E" stroke-width="1.5" opacity="0.5"/>

    <!-- delicate three-petal bud at the top, warmth + a hand-finished feel -->
    <g transform="translate(300,26) scale(1.05)">
      <path d="M 0,0 C -3,-16 -13,-24 -22,-20 C -30,-16 -30,-4 -20,4 C -12,10 -3,8 0,0 Z" fill="url(#budGrad)"/>
      <path d="M 0,0 C 3,-16 13,-24 22,-20 C 30,-16 30,-4 20,4 C 12,10 3,8 0,0 Z" fill="url(#budGrad)" opacity="0.92"/>
      <path d="M 0,0 C 0,-18 0,-30 0,-34 C 6,-28 6,-14 0,0 Z" fill="url(#budGrad)" opacity="0.85"/>
      <circle cx="0" cy="2" r="4.5" fill="#7A3B1E"/>
    </g>
  </g>

  <!-- ================= WORDMARK ================= -->
  <g id="wordmark">
    <text x="300" y="528" text-anchor="middle" font-family="Playfair Display" font-style="italic" font-weight="600" font-size="78" fill="#3A2318">Victorious</text>
    <text x="300" y="578" text-anchor="middle" font-family="Jost" font-weight="500" font-size="22" fill="#B5773F" letter-spacing="9">CONCEPT BAGS</text>
  </g>
</svg>
